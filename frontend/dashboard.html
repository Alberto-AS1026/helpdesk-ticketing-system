<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Help Desk - Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  <nav class="topbar">
    <span class="nav-links">
      <a class="link" href="/"><strong>Help Desk</strong></a>
      <a class="link" href="/">Tickets</a>
      <a class="link" id="dash-link" href="/dashboard.html" hidden>Dashboard</a>
      <a class="link" href="/chat.html">Chat <span id="chat-unread" class="count-badge" hidden></span></a>
    </span>
    <div class="user-box">
      <span id="user-name" class="muted"></span>
      <div class="user-actions">
        <button id="theme-btn" class="icon-btn" type="button" title="Cambiar tema" aria-label="Cambiar tema">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        </button>
        <button id="logout-btn" class="icon-btn" type="button" title="Salir" aria-label="Salir">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="header-row">
      <h1>Dashboard</h1>
      <div>
        <label for="days">Periodo</label>
        <select id="days">
          <option value="7">Últimos 7 días</option>
          <option value="30" selected>Últimos 30 días</option>
          <option value="90">Últimos 90 días</option>
          <option value="180">Últimos 180 días</option>
        </select>
      </div>
    </div>

    <p id="message" class="error" role="alert"></p>

    <div class="kpis" id="kpis"></div>

    <div class="charts">
      <section class="chart-card">
        <h2>Tickets por estado</h2>
        <div class="chart-box"><canvas id="c-status"></canvas></div>
      </section>
      <section class="chart-card">
        <h2>Tickets por prioridad</h2>
        <div class="chart-box"><canvas id="c-priority"></canvas></div>
      </section>
      <section class="chart-card">
        <h2>Tickets por categoría</h2>
        <div class="chart-box"><canvas id="c-category"></canvas></div>
      </section>
      <section class="chart-card">
        <h2>Carga por técnico</h2>
        <div class="chart-box"><canvas id="c-tech"></canvas></div>
      </section>
      <section class="chart-card wide">
        <h2>Tickets creados por día</h2>
        <div class="chart-box"><canvas id="c-day"></canvas></div>
      </section>
    </div>
  </main>

  <script src="/js/vendor/chart.umd.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
