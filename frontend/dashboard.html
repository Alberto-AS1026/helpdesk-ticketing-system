<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | Help Desk</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme.js"></script>
</head>
<body>

  <main class="page">
    <div class="list-head">
      <div class="list-title">
        <h1>Dashboard de Service Desk</h1>
        <span class="muted">Visión general de los incidentes</span>
      </div>
      <div class="period">
        <label for="days">Periodo</label>
        <select id="days">
          <option value="7">Últimos 7 días</option>
          <option value="30" selected>Últimos 30 días</option>
          <option value="90">Últimos 90 días</option>
          <option value="180">Últimos 180 días</option>
        </select>
      </div>
    </div>

    <p id="message" class="error" role="alert"></p>

    <div class="kpis" id="kpis"></div>

    <div class="charts">
      <section class="chart-card">
        <h2>Incidentes por estado</h2>
        <div class="chart-box"><canvas id="c-status"></canvas></div>
      </section>
      <section class="chart-card">
        <h2>Incidentes por prioridad</h2>
        <div class="chart-box"><canvas id="c-priority"></canvas></div>
      </section>
      <section class="chart-card">
        <h2>Incidentes por categoría</h2>
        <div class="chart-box"><canvas id="c-category"></canvas></div>
      </section>
      <section class="chart-card">
        <h2>Carga por técnico</h2>
        <div class="chart-box"><canvas id="c-tech"></canvas></div>
      </section>
      <section class="chart-card wide">
        <h2>Incidentes creados por día</h2>
        <div class="chart-box"><canvas id="c-day"></canvas></div>
      </section>
    </div>
  </main>

  <script src="/js/vendor/chart.umd.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
