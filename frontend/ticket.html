<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Help Desk - Ticket</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  <nav class="topbar">
    <span class="nav-links">
      <a class="link" href="/"><strong>Help Desk</strong></a>
      <a class="link" href="/">Tickets</a>
      <a class="link" id="dash-link" href="/dashboard.html" hidden>Dashboard</a>
      <a class="link" href="/chat.html">Chat <span id="chat-unread" class="count-badge" hidden></span></a>
    </span>
    <div class="user-box">
      <span id="user-name" class="muted"></span>
      <div class="user-actions">
        <button id="theme-btn" class="icon-btn" type="button" title="Cambiar tema" aria-label="Cambiar tema">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        </button>
        <button id="logout-btn" class="icon-btn" type="button" title="Salir" aria-label="Salir">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <main class="container">
    <p><a class="link" href="/">&larr; Volver al listado</a></p>
    <p id="message" class="error" role="alert"></p>

    <div class="grid-2">
      <div>
        <section class="card" id="detail-card" hidden>
          <h1 id="t-title"></h1>
          <dl class="details" id="t-details"></dl>
          <p class="chat-cta" id="chat-cta" hidden>
            <a class="btn-link" id="chat-link" href="/chat.html"></a>
          </p>
        </section>

        <section class="card" id="comments-card" hidden>
          <h2>Comentarios</h2>
          <ul class="thread" id="comments"></ul>
          <form id="comment-form" novalidate>
            <label for="comment-text">Añadir comentario</label>
            <textarea id="comment-text" maxlength="2000"></textarea>
            <button type="submit">Comentar</button>
            <p class="error" id="comment-error" role="alert"></p>
          </form>
        </section>

        <section class="card" id="history-card" hidden>
          <h2>Historial</h2>
          <ul class="thread" id="history"></ul>
        </section>
      </div>

      <aside id="staff-panel" hidden>
        <section class="card">
          <h2>Asignar técnico</h2>
          <form id="assign-form" novalidate>
            <select id="technician"></select>
            <button type="submit">Asignar</button>
          </form>
        </section>

        <section class="card">
          <h2>Cambiar estado</h2>
          <form id="status-form" novalidate>
            <label for="new-status">Nuevo estado</label>
            <select id="new-status"></select>
            <label for="diagnosis">Diagnóstico</label>
            <textarea id="diagnosis" maxlength="2000"></textarea>
            <label for="solution">Solución</label>
            <textarea id="solution" maxlength="2000"></textarea>
            <button type="submit">Guardar</button>
          </form>
          <p class="muted">Para resolver hacen falta diagnóstico y solución.</p>
        </section>

        <p class="error" id="action-error" role="alert"></p>
        <p class="ok" id="action-ok" role="status"></p>
      </aside>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/ticket.js"></script>
</body>
</html>
