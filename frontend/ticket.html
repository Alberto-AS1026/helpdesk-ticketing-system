<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Incidente | Help Desk</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  <main class="page page-form">
    <div class="form-head">
      <a class="back-link" href="/" id="back-link" aria-label="Volver al listado">&lsaquo;</a>
      <div class="form-head-title">
        <span class="record-type">Incidente</span>
        <h1 id="t-number">Cargando…</h1>
      </div>
      <div class="form-actions" id="form-actions">
        <a class="btn btn-secondary" id="chat-link" href="/chat.html" hidden></a>
        <span id="status-actions" class="action-group"></span>
        <button class="btn btn-primary" id="update-btn" type="button" hidden>Actualizar</button>
      </div>
    </div>

    <ol class="process-flow" id="process-flow" aria-label="Estado del incidente"></ol>

    <p id="message" class="error" role="alert"></p>
    <p class="ok" id="action-ok" role="status"></p>

    <section class="form-card" id="detail-card" hidden>
      <div class="field-grid">
        <div class="field-col">
          <div class="field"><span class="f-label">Número</span><span class="f-value readonly" id="f-number"></span></div>
          <div class="field"><span class="f-label">Solicitante</span><span class="f-value readonly" id="f-caller"></span></div>
          <div class="field"><span class="f-label">Categoría</span><span class="f-value readonly" id="f-category"></span></div>
          <div class="field"><span class="f-label">Equipo afectado</span><span class="f-value readonly" id="f-computer"></span></div>
          <div class="field"><span class="f-label">Creado</span><span class="f-value readonly" id="f-created"></span></div>
        </div>
        <div class="field-col">
          <div class="field"><span class="f-label">Estado</span><span class="f-value readonly" id="f-status"></span></div>
          <div class="field"><span class="f-label">Prioridad</span><span class="f-value readonly" id="f-priority"></span></div>
          <div class="field">
            <label class="f-label" for="f-assigned">Asignado a</label>
            <span class="f-value readonly" id="f-assigned-ro"></span>
            <select class="f-value" id="f-assigned" hidden></select>
          </div>
          <div class="field" id="row-resolved" hidden><span class="f-label">Resuelto</span><span class="f-value readonly" id="f-resolved"></span></div>
          <div class="field" id="row-time" hidden><span class="f-label">Tiempo de resolución</span><span class="f-value readonly" id="f-time"></span></div>
        </div>
      </div>
      <div class="field field-wide"><span class="f-label">Breve descripción</span><span class="f-value readonly" id="f-title"></span></div>
      <div class="field field-wide"><span class="f-label">Descripción</span><span class="f-value readonly multiline" id="f-description"></span></div>
    </section>

    <section class="form-card tabs-card" id="tabs-card" hidden>
      <div class="tabs" role="tablist">
        <button class="tab active" type="button" role="tab" id="tab-notes" aria-selected="true" aria-controls="panel-notes">Notas</button>
        <button class="tab" type="button" role="tab" id="tab-resolution" aria-selected="false" aria-controls="panel-resolution">Información de resolución</button>
      </div>

      <div class="tab-panel" id="panel-notes" role="tabpanel" aria-labelledby="tab-notes">
        <form id="comment-form" class="note-form" novalidate>
          <label for="comment-text">Comentarios adicionales <span class="muted" id="caller-visible" hidden>(visibles para el solicitante)</span></label>
          <textarea id="comment-text" maxlength="2000" placeholder="Escribe un comentario…"></textarea>
          <div class="note-actions">
            <p class="error" id="comment-error" role="alert"></p>
            <button type="submit" class="btn btn-primary">Publicar</button>
          </div>
        </form>
        <h2 class="activity-title">Actividades</h2>
        <ul class="activity" id="activity"></ul>
      </div>

      <div class="tab-panel" id="panel-resolution" role="tabpanel" aria-labelledby="tab-resolution" hidden>
        <div class="field field-wide">
          <label class="f-label" for="diagnosis">Diagnóstico</label>
          <textarea class="f-value" id="diagnosis" maxlength="2000"></textarea>
        </div>
        <div class="field field-wide">
          <label class="f-label" for="solution">Solución</label>
          <textarea class="f-value" id="solution" maxlength="2000"></textarea>
        </div>
        <p class="muted hint" id="resolution-hint">Para resolver el incidente hacen falta diagnóstico y solución.</p>
      </div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/ticket.js"></script>
</body>
</html>
