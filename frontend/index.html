<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Help Desk - Tickets</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  <nav class="topbar">
    <span class="nav-links">
      <a class="link" href="/"><strong>Help Desk</strong></a>
      <a class="link" href="/">Tickets</a>
      <a class="link" id="dash-link" href="/dashboard.html" hidden>Dashboard</a>
      <a class="link" href="/chat.html">Chat <span id="chat-unread" class="count-badge" hidden></span></a>
    </span>
    <div class="user-box">
      <span id="user-name" class="muted"></span>
      <div class="user-actions">
        <button id="theme-btn" class="icon-btn" type="button" title="Cambiar tema" aria-label="Cambiar tema">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        </button>
        <button id="logout-btn" class="icon-btn" type="button" title="Salir" aria-label="Salir">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="header-row">
      <h1>Tickets</h1>
      <a class="btn-link" href="/new.html">Nuevo ticket</a>
    </div>

    <div class="toolbar">
      <div>
        <label for="f-q">Buscar (mín. 3 letras)</label>
        <input id="f-q" type="search" maxlength="100" placeholder="wifi, impresora...">
      </div>
      <div>
        <label for="f-status">Estado</label>
        <select id="f-status">
          <option value="">Todos</option>
          <option>Abierto</option>
          <option>En progreso</option>
          <option>Pendiente</option>
          <option>Resuelto</option>
          <option>Cerrado</option>
        </select>
      </div>
      <div>
        <label for="f-priority">Prioridad</label>
        <select id="f-priority"><option value="">Todas</option></select>
      </div>
      <div>
        <label for="f-category">Categoría</label>
        <select id="f-category"><option value="">Todas</option></select>
      </div>
      <div>
        <label for="f-sort">Ordenar por</label>
        <select id="f-sort">
          <option value="created_at:desc">Más recientes</option>
          <option value="created_at:asc">Más antiguos</option>
          <option value="priority:desc">Prioridad (alta primero)</option>
          <option value="status:asc">Estado</option>
        </select>
      </div>
      <div class="checkbox-row" id="unassigned-row" hidden>
        <input id="f-unassigned" type="checkbox">
        <label for="f-unassigned">Solo sin asignar</label>
      </div>
    </div>

    <p id="message" class="error" role="alert"></p>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th><th>Título</th><th>Estado</th><th>Prioridad</th>
            <th>Categoría</th><th>Creado por</th><th>Técnico</th><th>Fecha</th>
          </tr>
        </thead>
        <tbody id="tickets-body"></tbody>
      </table>
    </div>

    <div class="pager">
      <button id="prev-btn" type="button">Anterior</button>
      <span id="page-info" class="muted"></span>
      <button id="next-btn" type="button">Siguiente</button>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/tickets.js"></script>
</body>
</html>
