<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Incidentes | Help Desk</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  <main class="page">
    <div class="list-head">
      <div class="list-title">
        <h1 id="list-title">Incidentes</h1>
        <span class="muted" id="list-count"></span>
      </div>
      <div class="list-tools">
        <div class="search-field">
          <label class="sr-only" for="f-q">Buscar en el listado</label>
          <input id="f-q" type="search" maxlength="100" placeholder="Buscar en descripción (mín. 3 letras)">
        </div>
        <button id="filter-btn" class="btn btn-secondary" type="button" aria-expanded="false" aria-controls="filter-panel">Filtros</button>
        <a class="btn btn-primary" href="/new.html">Nuevo</a>
      </div>
    </div>

    <div class="breadcrumbs" id="breadcrumbs" aria-label="Condiciones del filtro"></div>

    <section class="filter-panel" id="filter-panel" hidden>
      <div class="filter-grid">
        <div>
          <label for="f-status">Estado</label>
          <select id="f-status">
            <option value="">-- Cualquiera --</option>
            <option>Abierto</option>
            <option>En progreso</option>
            <option>Pendiente</option>
            <option>Resuelto</option>
            <option>Cerrado</option>
          </select>
        </div>
        <div>
          <label for="f-priority">Prioridad</label>
          <select id="f-priority"><option value="">-- Cualquiera --</option></select>
        </div>
        <div>
          <label for="f-category">Categoría</label>
          <select id="f-category"><option value="">-- Cualquiera --</option></select>
        </div>
        <div data-staff hidden>
          <label for="f-tech">Asignado a</label>
          <select id="f-tech"><option value="">-- Cualquiera --</option></select>
        </div>
        <div>
          <label for="f-from">Creado desde</label>
          <input id="f-from" type="date">
        </div>
        <div>
          <label for="f-to">Creado hasta</label>
          <input id="f-to" type="date">
        </div>
        <div class="checkbox-row" data-staff hidden>
          <input id="f-unassigned" type="checkbox">
          <label for="f-unassigned">Solo sin asignar</label>
        </div>
      </div>
      <div class="filter-actions">
        <button id="clear-btn" class="btn btn-secondary" type="button">Limpiar filtros</button>
      </div>
    </section>

    <p id="message" class="error" role="alert"></p>

    <div class="table-wrap">
      <table class="list-table">
        <thead>
          <tr>
            <th><button class="sort-btn" type="button" data-sort="id">Número</button></th>
            <th>Breve descripción</th>
            <th>Solicitante</th>
            <th><button class="sort-btn" type="button" data-sort="priority">Prioridad</button></th>
            <th><button class="sort-btn" type="button" data-sort="status">Estado</button></th>
            <th>Categoría</th>
            <th>Asignado a</th>
            <th><button class="sort-btn" type="button" data-sort="created_at">Creado</button></th>
          </tr>
        </thead>
        <tbody id="tickets-body"></tbody>
      </table>
    </div>

    <div class="pager">
      <span id="page-info" class="muted"></span>
      <div class="pager-btns">
        <button id="first-btn" class="btn btn-secondary btn-icon" type="button" aria-label="Primera página">&laquo;</button>
        <button id="prev-btn" class="btn btn-secondary btn-icon" type="button" aria-label="Página anterior">&lsaquo;</button>
        <button id="next-btn" class="btn btn-secondary btn-icon" type="button" aria-label="Página siguiente">&rsaquo;</button>
        <button id="last-btn" class="btn btn-secondary btn-icon" type="button" aria-label="Última página">&raquo;</button>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/tickets.js"></script>
</body>
</html>
