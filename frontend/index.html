<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Help Desk - Tickets</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="topbar">
    <span class="nav-links">
      <strong>Help Desk</strong>
      <a class="link" href="/">Tickets</a>
      <a class="link" id="dash-link" href="/dashboard.html" hidden>Dashboard</a>
    </span>
    <span><span id="user-name" class="muted"></span> <button id="logout-btn" type="button">Salir</button></span>
  </nav>

  <main class="container">
    <div class="header-row">
      <h1>Tickets</h1>
      <a class="btn-link" href="/new.html">Nuevo ticket</a>
    </div>

    <div class="toolbar">
      <div>
        <label for="f-q">Buscar (mín. 3 letras)</label>
        <input id="f-q" type="search" maxlength="100" placeholder="wifi, impresora...">
      </div>
      <div>
        <label for="f-status">Estado</label>
        <select id="f-status">
          <option value="">Todos</option>
          <option>Abierto</option>
          <option>En progreso</option>
          <option>Pendiente</option>
          <option>Resuelto</option>
          <option>Cerrado</option>
        </select>
      </div>
      <div>
        <label for="f-priority">Prioridad</label>
        <select id="f-priority"><option value="">Todas</option></select>
      </div>
      <div>
        <label for="f-category">Categoría</label>
        <select id="f-category"><option value="">Todas</option></select>
      </div>
      <div>
        <label for="f-sort">Ordenar por</label>
        <select id="f-sort">
          <option value="created_at:desc">Más recientes</option>
          <option value="created_at:asc">Más antiguos</option>
          <option value="priority:desc">Prioridad (alta primero)</option>
          <option value="status:asc">Estado</option>
        </select>
      </div>
      <div class="checkbox-row" id="unassigned-row" hidden>
        <input id="f-unassigned" type="checkbox">
        <label for="f-unassigned">Solo sin asignar</label>
      </div>
    </div>

    <p id="message" class="error" role="alert"></p>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th><th>Título</th><th>Estado</th><th>Prioridad</th>
            <th>Categoría</th><th>Creado por</th><th>Técnico</th><th>Fecha</th>
          </tr>
        </thead>
        <tbody id="tickets-body"></tbody>
      </table>
    </div>

    <div class="pager">
      <button id="prev-btn" type="button">Anterior</button>
      <span id="page-info" class="muted"></span>
      <button id="next-btn" type="button">Siguiente</button>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/tickets.js"></script>
</body>
</html>
