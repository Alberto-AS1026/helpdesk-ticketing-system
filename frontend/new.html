<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nuevo incidente | Help Desk</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  <main class="page page-form">
    <form id="new-form" novalidate>
      <div class="form-head">
        <a class="back-link" href="/" aria-label="Volver al listado">&lsaquo;</a>
        <div class="form-head-title">
          <span class="record-type">Incidente</span>
          <h1>Nuevo registro</h1>
        </div>
        <div class="form-actions">
          <a class="btn btn-secondary" href="/">Cancelar</a>
          <button type="submit" class="btn btn-primary">Enviar</button>
        </div>
      </div>

      <p class="error" id="error" role="alert"></p>

      <section class="form-card">
        <div class="field-grid">
          <div class="field-col">
            <div class="field"><span class="f-label">Solicitante</span><span class="f-value readonly" id="caller"></span></div>
            <div class="field">
              <label class="f-label required" for="category">Categoría</label>
              <select class="f-value" id="category"></select>
            </div>
            <div class="field">
              <label class="f-label" for="computer">Equipo afectado</label>
              <select class="f-value" id="computer"><option value="">-- Ninguno --</option></select>
            </div>
          </div>
          <div class="field-col">
            <div class="field"><span class="f-label">Estado</span><span class="f-value readonly"><span class="badge abierto">Abierto</span></span></div>
            <div class="field">
              <label class="f-label required" for="priority">Prioridad</label>
              <select class="f-value" id="priority"></select>
            </div>
          </div>
        </div>
        <div class="field field-wide">
          <label class="f-label required" for="title">Breve descripción</label>
          <input class="f-value" id="title" maxlength="200" placeholder="Resumen del problema en una línea">
        </div>
        <div class="field field-wide">
          <label class="f-label required" for="description">Descripción</label>
          <textarea class="f-value tall" id="description" maxlength="2000" placeholder="Qué ocurre, desde cuándo y qué has probado"></textarea>
        </div>
      </section>
    </form>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/new.js"></script>
</body>
</html>
