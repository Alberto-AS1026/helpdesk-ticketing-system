name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: helpdesk_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: helpdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helpdesk_user -d helpdesk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://helpdesk_user:ci_password@localhost:5432/helpdesk_test
      TEST_DATABASE_URL: postgresql://helpdesk_user:ci_password@localhost:5432/helpdesk_test
      SECRET_KEY: clave-solo-para-ci-0123456789abcdef0123456789abcdef

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Cargar esquema de la base de datos
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          export PGPASSWORD=ci_password
          psql -h localhost -U helpdesk_user -d helpdesk_test -f database/01_schema.sql
          psql -h localhost -U helpdesk_user -d helpdesk_test -f database/04_indexes.sql
          psql -h localhost -U helpdesk_user -d helpdesk_test -f database/06_chat.sql

      - name: Ejecutar tests con cobertura
        working-directory: backend
        run: python -m pytest --cov=app --cov-report=term-missing -q
