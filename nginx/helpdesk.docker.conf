# Configuración de Nginx para docker-compose (servicio "web").
# La de una instalación directa en el servidor es helpdesk.conf.

# Cabecera Connection para el WebSocket del chat
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # El navegador debe revalidar (ETag) antes de usar su copia: tras una
    # actualización nunca mezcla un .js antiguo con otro nuevo. Si no ha
    # cambiado, la respuesta es un 304 sin cuerpo.
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' ws://$http_host wss://$http_host; frame-ancestors 'none'" always;

    # Frontend estático
    location / {
        try_files $uri $uri/ =404;
    }

    # WebSocket del chat (avisos en tiempo real). La API cierra los sockets
    # sin actividad a los 60 s; el navegador manda un ping cada 25 s.
    location = /api/chat/ws {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # API: se quita el prefijo /api y se reenvía a FastAPI.
    # X-Forwarded-For se sobrescribe (no se añade) para que el cliente
    # no pueda inyectar una IP falsa y saltarse el límite de login.
    location /api/ {
        # Se resuelve "api" con el DNS de Docker en cada petición: si el
        # contenedor de la API se recrea y cambia de IP, Nginx no se queda
        # con la antigua (502).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
