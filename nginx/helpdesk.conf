# Cabecera Connection para el WebSocket del chat
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    root /home/helpdesk/helpdesk/frontend;
    index index.html;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # El navegador debe revalidar (ETag) antes de usar su copia: tras una
    # actualización nunca mezcla un .js antiguo con otro nuevo. Si no ha
    # cambiado, la respuesta es un 304 sin cuerpo.
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' ws://$http_host wss://$http_host; frame-ancestors 'none'" always;

    # Frontend estático
    location / {
        try_files $uri $uri/ =404;
    }

    # WebSocket del chat (avisos en tiempo real)
    location = /api/chat/ws {
        proxy_pass http://127.0.0.1:8000/chat/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # API: se quita el prefijo /api y se reenvía a FastAPI
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
